name: 更新監測資料

on:
  schedule:
    - cron: '10 * * * *'     # 每小時第 10 分執行 (UTC;實際更新頻率以此為準)
  workflow_dispatch: {}        # 允許在 GitHub 網頁上手動觸發

# 讓 workflow 有權限把更新後的 data/ commit 回 repo
permissions:
  contents: write

# 避免多個排程同時跑造成 push 衝突
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install -r requirements.txt

      # 只抓雨量 + 地震 (公開 API)。GNSS 的 rmdgnss.com 只允許台灣網路,
      # 由校園端電腦每天另外同步,GitHub 這裡不碰 gnss.json / summary.json。
      - name: 抓雨量、地震資料
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/build_data.py rainfall earthquake

      - name: 有變更才 commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add data/rainfall.json data/rainfall_hourly.json data/earthquake.json
          if git diff --staged --quiet; then
            echo "資料無變更,略過"
          else
            git commit -m "chore: 更新雨量/地震資料"
            git push
          fi
